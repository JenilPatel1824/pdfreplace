{{define "article.html"}}<!DOCTYPE html>
<html lang="en">
<head>{{template "head" .}}
<script type="application/ld+json">{
  "@context":"https://schema.org",
  "@type":"Article",
  "headline":{{.Article.h1 | printf "%q"}},
  "description":{{with .SEO}}{{.description | printf "%q"}}{{end}},
  "inLanguage":"en-US",
  "url":"{{.CanonicalURL}}",
  "mainEntityOfPage":{"@type":"WebPage","@id":"{{.CanonicalURL}}"},
  "image":[{"@type":"ImageObject","url":{{printf "%s%s" .SiteOrigin .OGImage | printf "%q"}},"width":1200,"height":630}],
  "datePublished":{{with index .Article "datePublished"}}{{printf "%q" .}}{{else}}""{{end}},
  "dateModified":{{with index .Article "dateModified"}}{{printf "%q" .}}{{else}}""{{end}},
  "author":{"@type":"Organization","name":{{.Site.brand | printf "%q"}},"url":{{printf "%s/" .SiteOrigin | printf "%q"}}},
  "publisher":{"@type":"Organization","name":{{.Site.brand | printf "%q"}},"url":{{printf "%s/" .SiteOrigin | printf "%q"}},"logo":{"@type":"ImageObject","url":{{printf "%s/static/logo-publisher.png" .SiteOrigin | printf "%q"}},"width":600,"height":60}}
}</script>
<script type="application/ld+json">{
  "@context":"https://schema.org",
  "@type":"BreadcrumbList",
  "itemListElement":[
    {"@type":"ListItem","position":1,"name":"Home","item":{{printf "%s/" .SiteOrigin | printf "%q"}}},
    {"@type":"ListItem","position":2,"name":{{.Article.h1 | printf "%q"}},"item":{{.CanonicalURL | printf "%q"}}}
  ]
}</script>
</head>
<body>
{{template "header" .}}

<main>
<article class="article reveal">
  <h1>{{.Article.h1}}</h1>
  <p class="lead">{{.Article.lead}}</p>

  {{template "ad_slot" .}}

  {{range .Article.sections}}
    <h2>{{.h}}</h2>
    <p>{{.p}}</p>
  {{end}}

  <p style="margin-top:32px"><a class="btn primary big" href="/editor">{{.Site.ctaPrimary}}</a></p>

  {{template "ad_slot" .}}
</article>
</main>

{{template "footer" .}}
<script src="/static/js/site.js"></script>
</body>
</html>{{end}}
